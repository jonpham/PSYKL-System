name: CD Publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push container images to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: service-task
            dockerfile: components/service-task/Dockerfile
          - component: web_client
            dockerfile: components/web_client/Dockerfile

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The default docker driver does not support `cache-to: type=gha`.
      # setup-buildx-action installs a docker-container builder that does.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/jonpham/psykl-${{ matrix.component }}:${{ github.sha }}
            ghcr.io/jonpham/psykl-${{ matrix.component }}:latest
          build-args: |
            VITE_API_URL=/api
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
