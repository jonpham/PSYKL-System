name: CI E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'spec/**']

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm via Corepack
        run: corepack enable

      - name: Get pnpm store path
        id: pnpm-cache-path
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache-path.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (Chromium only)
        run: pnpm --filter @psykl/e2e exec playwright install --with-deps chromium

      - name: Build compose images and start stack with E2E overlay
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build

      - name: Wait for service-task to be healthy
        run: |
          for i in {1..30}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/tasks || echo 000)
            if [ "$status" = "401" ]; then echo "service-task ready"; exit 0; fi
            echo "waiting for service-task... attempt $i (status $status)"
            sleep 2
          done
          echo "service-task did not become ready" >&2
          exit 1

      - name: Wait for web-client to be healthy
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:5173/ > /dev/null; then echo "web-client ready"; exit 0; fi
            echo "waiting for web-client... attempt $i"
            sleep 2
          done
          echo "web-client did not become ready" >&2
          exit 1

      - name: Run Playwright E2E
        run: pnpm --filter @psykl/e2e test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Print Docker Compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color

      - name: Tear down compose stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
