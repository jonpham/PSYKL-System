name: CI E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'spec/**']

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm via Corepack
        run: corepack enable

      - name: Get pnpm store path
        id: pnpm-cache-path
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache-path.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (Chromium only)
        run: pnpm verify:e2e:install-browsers

      - name: Build compose images and start stack with E2E overlay
        run: ./scripts/e2e-up.sh

      - name: Wait for service-task to be healthy
        run: ./scripts/wait-for-service-task.sh

      - name: Wait for web-client to be healthy
        run: ./scripts/wait-for-web-client.sh

      - name: Run Playwright E2E
        run: pnpm verify:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Print Docker Compose logs on failure
        if: failure()
        run: ./scripts/e2e-logs.sh

      - name: Tear down compose stack
        if: always()
        run: ./scripts/e2e-down.sh
