<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- favicon.svg carries its own prefers-color-scheme rule, so the tab icon
         follows the viewer's theme; the .ico is the fallback for browsers that
         do not take an SVG icon. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Add to Home Screen bakes in whichever tile this link points at, so the
         app rewrites the href to match the appearance in force
         (`src/preferences/apply.ts`). Light is the pre-JS default. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#1a1a2e" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The light app background, for the moment before JS runs; after that
         `applyThemeColor` keeps it on whatever `--bg-app` the theme resolves. -->
    <meta name="theme-color" content="#ffffff" />
    <title>PSYKL-System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
